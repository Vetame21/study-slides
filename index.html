<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Study Slides</title>
<!-- KaTeX typesets the slides' "formula" lines; without it they fall back to raw LaTeX text. -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<style>
  :root {
    --bg: #f6f5f1; --card: #ffffff; --text: #1d1d1f; --muted: #6b6b70; --line: #e3e1da;
    --accent: #2f5bd3; --tile: #e6ecfb; --code-bg: #f1f0ea;
    --what: #2f5bd3; --how: #1f8a5b; --why: #b5651d; --remember: #8a3fb5;
    --wrong: #c0392b; --right: #1f8a5b; --wrong-bg: #fbe9e7; --right-bg: #e5f5ec; --note-bg: #fff8e6;
    --c1: #2f5bd3; --c2: #0f8b8d; --c3: #7a5af5; --c4: #d0661c; --c5: #b8336a; --c6: #c0392b;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #181a1f; --card: #1f2228; --text: #e6e8ec; --muted: #9aa0aa; --line: #2c3038;
      --accent: #8fa8ff; --tile: #1f2b3d; --code-bg: #262a31;
      --what: #8fa8ff; --how: #5cc493; --why: #e3a15c; --remember: #c48ae6;
      --wrong: #ef7a6d; --right: #5cc493; --wrong-bg: #3a2220; --right-bg: #1c3328; --note-bg: #2a2618;
      --c1: #8fa8ff; --c2: #4fd1c5; --c3: #b9a3ff; --c4: #f0a35e; --c5: #f07fb0; --c6: #ef7a6d;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 17px/1.55 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 820px; margin: 0 auto; padding: 24px 16px 64px; }
  a { color: var(--accent); }
  h1 { font-size: 1.6rem; margin: 8px 0 4px; }
  .muted { color: var(--muted); }
  button { font: inherit; cursor: pointer; border: 1px solid var(--line); background: var(--card);
           color: var(--text); border-radius: 8px; padding: 8px 14px; }
  button:hover:not(:disabled) { border-color: var(--accent); }
  button:disabled { opacity: .4; cursor: default; }
  .topbar { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px; }

  /* Menu rows: icon tile, title + subtitle, chevron */
  .rows { margin-top: 16px; border-top: 1px solid var(--line); }
  .row { display: flex; align-items: center; gap: 20px; padding: 16px 8px; text-decoration: none;
         color: var(--text); border-bottom: 1px solid var(--line); }
  .row:hover { background: color-mix(in srgb, var(--card) 60%, transparent); }
  .row .tile { flex: none; width: 88px; height: 56px; border-radius: 10px; background: var(--tile);
               display: grid; place-items: center; color: var(--accent); font-size: 1.5rem; }
  .row .tile svg { width: 26px; height: 26px; }
  .row .text { flex: 1; min-width: 0; }
  .row b { display: block; font-size: 1.15rem; }
  .row .chev { color: var(--muted); font-size: 1.6rem; line-height: 1; }

  /* Slide card */
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 24px; margin-top: 16px; }
  .chapter { font-size: .85rem; color: var(--muted); }
  .tag { display: inline-block; font-size: .75rem; font-weight: 700; letter-spacing: .06em;
         padding: 2px 8px; border-radius: 6px; border: 1px solid currentColor; margin-top: 8px; }
  .tag.WHAT { color: var(--what); } .tag.HOW { color: var(--how); }
  .tag.WHY { color: var(--why); } .tag.REMEMBER { color: var(--remember); }
  h2 { margin: 8px 0 12px; font-size: 1.4rem; }
  .body { white-space: pre-line; }
  pre { background: var(--code-bg); padding: 14px; border-radius: 8px; overflow-x: auto;
        font: 14px/1.45 ui-monospace, Menlo, Consolas, monospace; margin: 14px 0 0; }
  .formula { margin-top: 14px; padding: 6px 16px; border-radius: 10px; background: var(--code-bg);
             border-left: 3px solid var(--accent); overflow-x: auto; }
  .formula .katex-display { margin: 10px 0; }
  .formula .katex { font-size: 1.15em; }
  .formula-line.raw { font: 14px/1.6 ui-monospace, Menlo, Consolas, monospace; padding: 8px 0; }
  .box { margin-top: 16px; padding: 12px 14px; border-radius: 8px; background: var(--note-bg); white-space: pre-line; }
  .label { font-size: .8rem; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; margin-bottom: 4px; }
  .wr { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 16px; }
  .wr > div { min-width: 0; }
  .wr .wrong .label { color: var(--wrong); } .wr .right .label { color: var(--right); }
  .wr pre { margin-top: 0; }
  .wr .wrong pre { border-left: 3px solid var(--wrong); } .wr .right pre { border-left: 3px solid var(--right); }
  .reason { margin-top: 6px; font-size: .95rem; }
  .qc { margin-top: 16px; border-top: 1px dashed var(--line); padding-top: 14px; }
  .qc .answer { margin-top: 8px; }
  .nav { display: flex; justify-content: space-between; align-items: center; margin-top: 16px; }

  /* Figures: inline SVGs from tools/figures.py, coloured by these classes */
  .figs { display: flex; flex-wrap: wrap; gap: 16px 24px; margin-top: 16px; }
  .fig { margin: 0; flex: 1 1 260px; min-width: 0; overflow-x: auto; }
  .fig svg { display: block; width: 100%; height: auto; }
  .fig figcaption { font-size: .85rem; color: var(--muted); margin-top: 6px; }
  .fig text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  .fig .t { fill: var(--text); } .fig .m { fill: var(--muted); }
  .fig .ax { stroke: var(--muted); stroke-width: 1.2; } .fig .grid { stroke: var(--line); }
  .fig .box { fill: var(--card); stroke: var(--muted); stroke-width: 1.2; }
  .fig .box.empty { fill: none; stroke-dasharray: 4 4; }
  .fig .box.found { fill: var(--right-bg); stroke: var(--right); stroke-width: 2.5; }
  .fig .edge { stroke: var(--muted); stroke-width: 1.2; }
  .fig .node { fill: var(--tile); stroke: var(--accent); stroke-width: 1.5; }
  .fig .mx { stroke: var(--wrong); stroke-width: 2.2; stroke-linecap: round; }
  .fig .mo { fill: none; stroke: var(--how); stroke-width: 2; }
  .fig .hl { stroke: var(--accent); stroke-width: 2; } .fig .ahead { fill: var(--accent); }
  .fig .ok { stroke: var(--right); stroke-width: 2.5; }
  .fig .cell { fill: none; stroke: var(--line); }
  .fig .cell.on { fill: var(--accent); fill-opacity: .55; stroke: var(--card); }
  .fig .badge { fill: var(--accent); } .fig .badge-t { fill: var(--card); font-weight: 700; }
  .fig .curve { fill: none; stroke-width: 2.5; }
  .fig .c1 { stroke: var(--c1); } .fig .c2 { stroke: var(--c2); } .fig .c3 { stroke: var(--c3); }
  .fig .c4 { stroke: var(--c4); } .fig .c5 { stroke: var(--c5); } .fig .c6 { stroke: var(--c6); }
  .fig text.c1, .fig rect.c1 { fill: var(--c1); stroke: none; } .fig text.c2 { fill: var(--c2); stroke: none; }
  .fig text.c3 { fill: var(--c3); stroke: none; } .fig text.c4, .fig rect.c4 { fill: var(--c4); stroke: none; }
  .fig text.c5 { fill: var(--c5); stroke: none; } .fig text.c6 { fill: var(--c6); stroke: none; }
  .fig text.lbl { font-weight: 700; }

  /* Interactive demos (demos.js) */
  .practice { display: inline-block; margin-left: 8px; font-size: .75rem; color: var(--muted);
              border: 1px dashed var(--line); border-radius: 6px; padding: 1px 7px; vertical-align: 1px; }
  .demo { margin-top: 16px; border: 1px solid var(--line); border-radius: 12px; padding: 14px; background: var(--bg); }
  .demo-head { font-size: .8rem; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: var(--accent); }
  .demo-controls { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; margin: 10px 0; }
  .demo-controls button { padding: 6px 10px; font-size: .9rem; }
  .demo-controls button.active { border-color: var(--accent); background: var(--tile); }
  .demo-slider { display: flex; align-items: center; gap: 8px; font-size: .9rem; }
  .demo-slider input { accent-color: var(--accent); width: 130px; }
  .demo-slider output { font-variant-numeric: tabular-nums; min-width: 2.6em; }
  .demo input.num { width: 4.2em; font: inherit; padding: 4px 6px; border: 1px solid var(--line);
                    border-radius: 6px; background: var(--card); color: var(--text); }
  .demo-readout { margin-top: 8px; display: grid; gap: 6px; font-size: .95rem; }
  .demo-readout .muted { color: var(--muted); font-size: .9rem; }
  .demo .mono { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: .88rem; overflow-x: auto; white-space: nowrap; }
  .demo .warn { color: var(--wrong); font-weight: 600; }
  .demo-table { border-collapse: collapse; font-variant-numeric: tabular-nums; justify-self: start; }
  .demo-table th, .demo-table td { padding: 2px 14px 2px 0; text-align: right; border-bottom: 1px solid var(--line); }
  .demo-table tr.sum td { font-weight: 700; border-bottom: none; }
  .demo-legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: .85rem; margin-top: 8px; }
  .sw { display: inline-block; width: 11px; height: 11px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; }
  .sw.tp, .fig .person.tp { background: var(--c6); fill: var(--c6); }
  .sw.fn, .fig .person.fn { background: var(--c6); fill: var(--c6); opacity: .3; }
  .sw.fp, .fig .person.fp { background: var(--c4); fill: var(--c4); }
  .sw.tn, .fig .person.tn { background: var(--line); fill: var(--line); }
  .bayes-compare { display: flex; flex-wrap: wrap; gap: 6px 24px; }
  .fig .dot { fill: var(--accent); } .fig .dot.hot { fill: var(--c4); }
  .fig .fulcrum { fill: var(--c4); } .fig .stepdot { fill: var(--c2); }
  .fig .band { fill: var(--accent); fill-opacity: .12; }
  .fig .region { fill: transparent; transition: fill-opacity .2s; }
  .fig .region.on { fill: var(--accent); fill-opacity: .35; }
  .fig .outline { fill: none; stroke: var(--text); stroke-width: 1.5; }
  .fig rect.c2 { fill: var(--c2); stroke: none; }
  .perm-grid { display: grid; gap: 5px; margin-top: 6px; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: .85rem; }
  .perm-row { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
  .chip { padding: 2px 7px; border: 1px solid var(--line); border-radius: 6px; background: var(--card); transition: opacity .4s; }
  .perm-grid.collapsed .chip.dup-able { opacity: .15; text-decoration: line-through; }
  .perm-grid.collapsed .chip.first { border-color: var(--accent); background: var(--tile); font-weight: 700; }
  .perm-count { color: var(--muted); font-size: .8rem; margin-left: 4px; }

  /* Physics demos */
  .fig .vec { stroke-width: 2; } .fig .vechead { stroke: none; }
  .fig .vec.part { stroke: var(--muted); stroke-width: 1.5; } .fig .vechead.part { fill: var(--muted); }
  .fig .vec.net { stroke: var(--c4); stroke-width: 3; } .fig .vechead.net { fill: var(--c4); }
  .fig .vec.c4 { stroke: var(--c4); } .fig .vechead.c4 { fill: var(--c4); }
  .fig .vec.efield { stroke: var(--line); stroke-width: 1.5; } .fig .vechead.efield { fill: var(--line); }
  .fig .vec.fhit { stroke: var(--accent); stroke-width: 2; } .fig .vechead.fhit { fill: var(--accent); }
  .fig .vec.fdir { stroke: none; } .fig .vechead.fdir { fill: var(--muted); }
  .fig .fline { fill: none; stroke: var(--muted); stroke-width: 1; opacity: .7; }
  .fig .charge { stroke: var(--card); stroke-width: 2; cursor: grab; }
  .fig .charge.pos { fill: var(--c6); } .fig .charge.neg { fill: var(--c1); } .fig .charge.zero { fill: var(--muted); }
  .fig .chg-t { fill: #fff; font-weight: 700; pointer-events: none; }
  .fig .probe { fill: var(--text); stroke: var(--card); stroke-width: 2; cursor: grab; }
  .fig .plate { fill: var(--muted); } .fig .drop { fill: var(--c2); }
  .fig .rod { stroke: var(--muted); stroke-width: 4; stroke-linecap: round; }
  .fig .loop { stroke: var(--text); stroke-width: 5; stroke-linecap: round; }
  .fig .gsurf { fill: none; stroke-width: 4; } .fig .gsurf.out { stroke: var(--c6); } .fig .gsurf.in { stroke: var(--c1); }
  .fig .shellline { fill: none; stroke: var(--c6); stroke-width: 4; }
  .fig .solid { fill: var(--c6); fill-opacity: .35; stroke: var(--c6); stroke-width: 2; }
  .fig .metal { fill: none; stroke: var(--muted); stroke-opacity: .35; }

  /* Quiz */
  .q { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 20px; margin-top: 16px; }
  .q .src { font-size: .8rem; color: var(--muted); }
  .q .stem { font-weight: 600; margin: 4px 0 0; }
  .opts { display: grid; gap: 8px; margin-top: 12px; }
  .opts button { text-align: left; padding: 10px 14px; }
  .opts button.correct { border-color: var(--right); background: var(--right-bg); }
  .opts button.chosen-wrong { border-color: var(--wrong); background: var(--wrong-bg); }
  .opts button:disabled { opacity: 1; cursor: default; }
  .why { margin-top: 12px; font-size: .95rem; }
  .why b.ok { color: var(--right); } .why b.no { color: var(--wrong); }
  .score { position: sticky; bottom: 0; margin-top: 20px; padding: 12px 16px; border-radius: 12px;
           background: var(--card); border: 1px solid var(--line);
           display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  @media (max-width: 600px) {
    .wr { grid-template-columns: 1fr; } .card { padding: 18px; }
    .row { gap: 14px; } .row .tile { width: 64px; height: 48px; }
  }
</style>
</head>
<body>
<main id="app"></main>
<script src="demos.js"></script>
<script>
// Each subject is a folder holding slides.json (lectures) and quiz.json (class quizzes).
// Add a subject by adding a line here. `book` is the textbook named in the course slides.
const SUBJECTS = [
  { id: "data-structure",         name: "Data Structure",            icon: "🌳",
    book: "Data Structures and Algorithm Analysis in C++, Third Edition, Clifford A. Shaffer" },
  { id: "statistics-probability", name: "Statistics and Probability", icon: "🎲",
    book: "Probability and Statistics for Engineering and the Sciences, International 9th ed. (2017), Jay L. Devore" },
  { id: "digital-logic",          name: "Digital Logic",             icon: "🔌" },
  { id: "college-physics-2",      name: "College Physics 2",         icon: "⚛️",
    book: "Fundamentals of Physics (Halliday, Resnick & Walker) · lecture slides © mxhuang@scut.edu.cn" },
];

const ICON_QUIZ = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M9.1 9a3 3 0 0 1 5.8 1c0 2-3 3-3 3"/><path d="M12 17h.01"/></svg>';
const ICON_LECTURE = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/></svg>';

// UI strings that are not part of the slide/quiz data.
const UI = {
  en: { pick: "Pick a subject.", all: "← All subjects", soon: "Coming soon", quizzes: "Class quizzes",
        toPractice: n => n + " to practice", lectures: "Lectures", chaptersOf: n => n + " chapters of slides",
        slides: n => n + (n === 1 ? " slide" : " slides"), questions: n => n + " questions", back: "← Back", next: "Next →",
        homeSub: (c, s) => `${c} chapters · ${s} slides`, textbook: "📖 Textbook: ",
        tryIt: "▶ Try it", practised: "📝 Practised in ",
        show: "Show answer", correct: "Correct.", wrong: "Not quite.", score: (c, a, t) => `Score: ${c} / ${t}  (${a} answered)`,
        retry: "Retry", empty: "Coming soon: nothing in this folder yet.", explain: "Explain",
        wrongLbl: "✗ Wrong", rightLbl: "✓ Right", quickCheck: "Quick check", toggle: "🇮🇩 Bahasa Indonesia" },
  id: { pick: "Pilih mata kuliah.", all: "← Semua mata kuliah", soon: "Segera hadir", quizzes: "Kuis kelas",
        toPractice: n => n + " untuk latihan", lectures: "Materi kuliah", chaptersOf: n => n + " bab slide",
        slides: n => n + " slide", questions: n => n + " soal", back: "← Kembali", next: "Lanjut →",
        homeSub: (c, s) => `${c} bab · ${s} slide`, textbook: "📖 Buku teks: ",
        tryIt: "▶ Coba", practised: "📝 Dilatih di ",
        show: "Tampilkan jawaban", correct: "Benar.", wrong: "Belum tepat.", score: (c, a, t) => `Skor: ${c} / ${t}  (${a} dijawab)`,
        retry: "Ulangi", empty: "Segera hadir: folder ini belum berisi apa pun.", explain: "Penjelasan",
        wrongLbl: "✗ Salah", rightLbl: "✓ Benar", quickCheck: "Cek cepat", toggle: "🇬🇧 English" },
};

const app = document.getElementById("app");
const cache = {};
let lang = "en";
try { lang = localStorage.getItem("lang") || "en"; } catch (e) {}
const ui = () => UI[lang];
const tr = o => (o && typeof o === "object" ? o[lang] || o.en : o);  // pick {en, id} text

function el(tag, attrs = {}, ...kids) {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "onclick") n.onclick = v; else if (k === "html") n.innerHTML = v; else n.setAttribute(k, v);
  }
  for (const k of kids) if (k != null) n.append(k);
  return n;
}

// file is "slides" or "quiz"; a missing file is cached as null.
async function load(id, file) {
  const key = id + "/" + file;
  if (!(key in cache)) {
    try {
      const r = await fetch(key + ".json");
      cache[key] = r.ok ? await r.json() : null;
    } catch (e) { cache[key] = null; }
  }
  return cache[key];
}

// Chapters of a lecture deck: [{name, start}] where start is the first slide index.
function chaptersOf(slides) {
  const out = [];
  slides.forEach((s, i) => {
    if (!out.length || out[out.length - 1].key !== s.chapter)
      out.push({ key: s.chapter, name: lang === "id" && s.id ? s.id.chapter : s.chapter, start: i, count: 0 });
    out[out.length - 1].count++;
  });
  return out;
}

function row(href, tileHtml, title, sub) {
  return el("a", { class: "row", href },
    el("span", { class: "tile", html: tileHtml }),
    el("span", { class: "text" }, el("b", {}, title), el("span", { class: "muted" }, sub)),
    el("span", { class: "chev" }, "›"));
}

function topbar(backHref, backText) {
  return el("div", { class: "topbar" },
    el("a", { href: backHref }, backText),
    el("button", { onclick: () => {
      lang = lang === "en" ? "id" : "en";
      try { localStorage.setItem("lang", lang); } catch (e) {}
      route();
    } }, ui().toggle));
}

function renderHome() {
  const rows = SUBJECTS.map(s => row("#/" + s.id, s.icon, s.name, "…"));
  app.replaceChildren(
    el("div", { class: "topbar" }, el("h1", {}, "Study Slides"),
      el("button", { onclick: () => { lang = lang === "en" ? "id" : "en";
        try { localStorage.setItem("lang", lang); } catch (e) {} route(); } }, ui().toggle)),
    el("p", { class: "muted" }, ui().pick),
    el("div", { class: "rows" }, ...rows));
  SUBJECTS.forEach((s, i) => load(s.id, "slides").then(d => {
    rows[i].querySelector(".muted").textContent = d ? ui().homeSub(chaptersOf(d).length, d.length) : ui().soon;
  }));
}

async function renderSubject(subject) {
  const [slides, quiz] = await Promise.all([load(subject.id, "slides"), load(subject.id, "quiz")]);
  const rows = [];
  if (quiz) rows.push(row("#/" + subject.id + "/quiz", ICON_QUIZ, ui().quizzes, ui().toPractice(quiz.length)));
  if (slides) rows.push(row("#/" + subject.id + "/lectures", ICON_LECTURE, ui().lectures, ui().chaptersOf(chaptersOf(slides).length)));
  app.replaceChildren(topbar("#/", ui().all), el("h1", {}, subject.name),
    ...(subject.book ? [el("p", { class: "muted" }, ui().textbook + subject.book)] : []),
    rows.length ? el("div", { class: "rows" }, ...rows) : el("p", { class: "muted" }, ui().empty));
}

async function renderQuizList(subject) {
  const quiz = await load(subject.id, "quiz");
  if (!quiz) return renderSubject(subject);
  app.replaceChildren(topbar("#/" + subject.id, "← " + subject.name), el("h1", {}, ui().quizzes),
    el("div", { class: "rows" }, ...quiz.map((c, i) =>
      row("#/" + subject.id + "/quiz/" + (i + 1), ICON_QUIZ, tr(c.chapter), ui().questions(c.questions.length)))));
}

async function renderLectureList(subject) {
  const slides = await load(subject.id, "slides");
  if (!slides) return renderSubject(subject);
  app.replaceChildren(topbar("#/" + subject.id, "← " + subject.name), el("h1", {}, ui().lectures),
    el("div", { class: "rows" }, ...chaptersOf(slides).map(c =>
      row("#/" + subject.id + "/slides/" + (c.start + 1), ICON_LECTURE, c.name, ui().slides(c.count)))));
}

async function renderQuiz(subject, n) {
  const quiz = await load(subject.id, "quiz");
  const chap = quiz && quiz[n - 1];
  if (!chap) return renderQuizList(subject);
  const total = chap.questions.length;
  let answered = 0, correct = 0;
  const scoreText = el("span", {}, ui().score(0, 0, total));

  const cards = chap.questions.map((q, qi) => {
    const why = el("div", { class: "why" }); why.hidden = true;
    const buttons = q.options.map((o, oi) => el("button", { onclick: () => {
      buttons.forEach(b => b.disabled = true);
      buttons[q.answer].classList.add("correct");
      const ok = oi === q.answer;
      if (!ok) buttons[oi].classList.add("chosen-wrong");
      answered++; if (ok) correct++;
      why.replaceChildren(el("b", { class: ok ? "ok" : "no" }, ok ? ui().correct : ui().wrong), " ", tr(q.why));
      why.hidden = false;
      scoreText.textContent = ui().score(correct, answered, total);
    } }, String.fromCharCode(65 + oi) + ". " + tr(o)));
    return el("div", { class: "q" },
      el("div", { class: "src" }, (qi + 1) + " / " + total + " · " + q.source),
      el("p", { class: "stem" }, tr(q.q)),
      q.code ? el("pre", {}, q.code) : null,
      el("div", { class: "opts" }, ...buttons),
      why);
  });

  app.replaceChildren(
    topbar("#/" + subject.id + "/quiz", "← " + ui().quizzes),
    el("h1", {}, tr(chap.chapter)),
    ...(chap.note ? [el("div", { class: "box" }, tr(chap.note))] : []),
    ...cards,
    el("div", { class: "score" }, scoreText, el("button", { onclick: () => { renderQuiz(subject, n); window.scrollTo(0, 0); } }, ui().retry)));
}

function renderSlide(subject, slides, i) {
  const s = slides[i];
  const t = lang === "id" && s.id ? s.id : s;  // Indonesian fields live in slide.id
  const go = k => { location.hash = "#/" + subject.id + "/slides/" + (k + 1); };
  const card = el("div", { class: "card" },
    el("div", { class: "chapter" }, t.chapter),
    el("span", { class: "tag " + s.tag }, s.tag),
    s.practice ? el("span", { class: "practice" }, ui().practised + s.practice) : null,
    el("h2", {}, t.title),
    el("div", { class: "body" }, t.body),
    s.formula ? formulaBox(s.formula) : null,
    s.code ? el("pre", {}, s.code) : null,
    s.images ? el("div", { class: "figs" }, ...s.images.map(im => figure(subject.id + "/" + im.src, tr(im.caption)))) : null,
    s.demo && window.DEMOS && DEMOS[s.demo] ? demoBox(s.demo) : null,
    t.explain ? el("div", { class: "box" }, el("div", { class: "label" }, ui().explain), t.explain) : null,
    s.wrong_right ? el("div", {},
      el("div", { class: "wr" },
        el("div", { class: "wrong" }, el("div", { class: "label" }, ui().wrongLbl), el("pre", {}, s.wrong_right.wrong)),
        el("div", { class: "right" }, el("div", { class: "label" }, ui().rightLbl), el("pre", {}, s.wrong_right.right))),
      el("div", { class: "reason" }, t.wrong_right_reason || s.wrong_right.reason)) : null,
    t.quick_check ? quickCheck(t.quick_check) : null
  );
  app.replaceChildren(
    topbar("#/" + subject.id + "/lectures", "← " + ui().lectures),
    el("h1", {}, subject.name),
    card,
    el("div", { class: "nav" },
      prevNext(ui().back, i > 0, () => go(i - 1)),
      el("span", { class: "muted" }, (i + 1) + " / " + slides.length),
      prevNext(ui().next, i < slides.length - 1, () => go(i + 1))));
  document.onkeydown = e => {
    if (e.key === "ArrowLeft" && i > 0) go(i - 1);
    if (e.key === "ArrowRight" && i < slides.length - 1) go(i + 1);
  };
}

// Figures are inlined (not <img>) so the page's CSS classes can colour them for light/dark.
// They are our own files from tools/figures.py, so inserting their markup is safe.
function figure(url, caption) {
  const fig = el("figure", { class: "fig" }, el("figcaption", {}, caption));
  const text = cache[url] ? Promise.resolve(cache[url])
    : fetch(url).then(r => r.ok ? r.text() : "").then(t => (cache[url] = t));
  text.then(t => {
    const svg = t && new DOMParser().parseFromString(t, "image/svg+xml").documentElement;
    if (!svg || svg.nodeName !== "svg") return;
    svg.setAttribute("role", "img");
    svg.setAttribute("aria-label", caption);
    // Don't blow small figures up past ~1.2× their drawn size, and don't shrink wide
    // ones below ~0.85× (text gets unreadable on phones; the figure scrolls instead).
    const w = svg.viewBox.baseVal.width;
    svg.style.maxWidth = (w * 1.2) + "px";
    svg.style.minWidth = Math.min(w * 0.85, 560) + "px";
    fig.prepend(document.importNode(svg, true));
  });
  return fig;
}

// Key formulas (LaTeX) typeset by KaTeX; if KaTeX didn't load, show the LaTeX source instead.
function formulaBox(lines) {
  return el("div", { class: "formula" }, ...lines.map(tex => {
    const line = el("div", { class: "formula-line" });
    if (window.katex) katex.render(tex, line, { displayMode: true, throwOnError: false });
    else { line.textContent = tex; line.classList.add("raw"); }
    return line;
  }));
}

// Interactive demo from demos.js; it draws itself into the box in the current language.
function demoBox(name) {
  const box = el("div", { class: "demo" }, el("div", { class: "demo-head" }, ui().tryIt));
  DEMOS[name](box, lang);
  return box;
}

function prevNext(label, enabled, fn) {
  const b = el("button", { onclick: fn }, label);
  b.disabled = !enabled;
  return b;
}

function quickCheck(qc) {
  const ans = el("div", { class: "answer" }, qc.a);
  ans.hidden = true;
  const btn = el("button", { onclick: () => { ans.hidden = false; btn.remove(); } }, ui().show);
  return el("div", { class: "qc" }, el("div", { class: "label" }, ui().quickCheck), el("div", {}, qc.q), btn, ans);
}

// Routes:
//   #/                          home (subjects)
//   #/<subject>                 menu: Class quizzes / Lectures
//   #/<subject>/quiz[/<n>]      quiz chapter list, or quiz for chapter n
//   #/<subject>/lectures        lecture chapter list
//   #/<subject>/slides/<n>      slide n
async function route() {
  document.onkeydown = null;
  const [, id, view, num] = location.hash.split("/");
  const subject = SUBJECTS.find(s => s.id === id);
  if (!subject) return renderHome();
  if (view === "quiz") return num ? renderQuiz(subject, parseInt(num) || 1) : renderQuizList(subject);
  if (view === "lectures") return renderLectureList(subject);
  if (view === "slides") {
    const slides = await load(id, "slides");
    if (!slides) return renderSubject(subject);
    const i = Math.min(Math.max((parseInt(num) || 1) - 1, 0), slides.length - 1);
    renderSlide(subject, slides, i);
    return window.scrollTo(0, 0);
  }
  renderSubject(subject);
}

window.addEventListener("hashchange", route);
route();
</script>
